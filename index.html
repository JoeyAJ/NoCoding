<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI와 대화로 만드는 소식지 편집기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Noto+Sans+TC:wght@400;600&family=Noto+Serif+KR:wght@600;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --fs:1;
  --navy:#173b63;--navy-deep:#0f2a48;
  --bg:#eef1f4;--paper:#ffffff;--ink:#1b2430;--muted:#4c5867;--line:#d3dae3;
  --pine:#2e6a4f;--pine-soft:#e2eee7;--warn:#a8423a;--warn-soft:#f6e6e3;
  --mark:#ffe27a;--bubble:#e3e9f0;--accent:#173b63;
  --serif:'Noto Serif KR','Noto Serif TC','Noto Serif CJK KR',Georgia,serif;
  --sans:'IBM Plex Sans KR','Noto Sans TC','Apple SD Gothic Neo','Malgun Gothic','Microsoft JhengHei',sans-serif;
  color-scheme:light;
}
html[lang="zh-Hant"]{
  --serif:'Noto Serif TC','Noto Serif KR',Georgia,serif;
  --sans:'Noto Sans TC','IBM Plex Sans KR','Microsoft JhengHei','PingFang TC',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11171f;--paper:#19222d;--ink:#e7ecf1;--muted:#a7b1bd;--line:#2d3947;
    --pine:#7fc4a2;--pine-soft:#1c3328;--warn:#e6948b;--warn-soft:#3a2522;
    --mark:rgba(255,214,90,.32);--bubble:#243242;--accent:#9cc0ea;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{font-size:calc(19px * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.75;overflow-wrap:anywhere}
html[lang="ko"] body{word-break:keep-all}
h1,h2,h3{font-family:var(--serif);line-height:1.35;margin:0;font-weight:700}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--pine);outline-offset:3px;border-radius:6px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:1080px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{background:none;border:0;padding:.3rem 0;cursor:pointer;font-family:var(--serif);font-weight:700;font-size:1rem;color:var(--accent);text-align:left}
.controls{margin-left:auto;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:.35rem .85rem;min-height:44px;cursor:pointer;font-size:.86rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.fontctl{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--muted)}
.fontctl button{width:44px;height:44px;border:1px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;font-size:1.05rem;font-weight:600}

/* Layout */
main{max-width:1080px;margin:0 auto;padding:2rem 1.25rem 3rem}
.lead{font-size:1.1rem;color:var(--muted);max-width:40rem}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.4rem 1.5rem;margin-top:1.6rem}
.panel>h3{font-size:1.15rem;margin-bottom:.8rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:.6rem 1.4rem;border-radius:12px;border:2px solid var(--navy);background:transparent;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:none;font-size:1rem}
.btn.primary{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){.btn{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#0f1a26}}
.btn-row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.4rem}
.small-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-height:44px;padding:.3rem .9rem;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--accent)}
.mark{background:linear-gradient(transparent 52%,var(--mark) 52%);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 .1em}
.take{font-family:var(--serif);font-size:1.18rem;line-height:1.8;margin-top:2rem;max-width:42rem}

/* Hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:3rem;align-items:center;padding:1rem 0 2.5rem}
.hero h1{font-size:2.35rem;letter-spacing:-.01em;margin-bottom:1.1rem}
.facts{margin:1.6rem 0 0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.facts dt,.facts dd{margin:0;padding:.65rem 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.9rem;padding-right:1.4rem;white-space:nowrap}
.facts dd{font-weight:600}
.cycle-wrap h2{font-size:1.05rem;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:1rem;text-align:center}
.cycle{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;list-style:none;margin:0;padding:0}
.cycle li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;position:relative}
.cycle li b{display:block;font-family:var(--serif);font-size:1.05rem}
.cycle li span{font-size:.86rem;color:var(--muted);line-height:1.55;display:block}
.cycle li i{font-style:normal;display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--navy);color:#fff;font-size:.82rem;font-weight:600;margin-bottom:.3rem}
@media (prefers-color-scheme:dark){.cycle li i{background:var(--accent);color:#0f1a26}}
.arrow{position:absolute;color:var(--pine);font-size:1.4rem;font-weight:700;line-height:1}
.arrow{transform:translate(-50%,-50%)}
.a1{left:50%;top:25%}.a2{left:75%;top:50%}.a3{left:50%;top:75%}.a4{left:25%;top:50%}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pine);color:#fff;border-radius:999px;padding:.25rem .9rem;font-size:.85rem;font-weight:600;z-index:2;white-space:nowrap}
@media (prefers-color-scheme:dark){.hub{color:#0f1a26}}

/* Step rail */
.rail-title{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:.7rem}
.rail{list-style:none;margin:0 0 2.2rem;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:.55rem}
.rail button{width:100%;height:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:.6rem .75rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;font-size:.86rem;line-height:1.4}
.rail .num{font-weight:600;color:var(--muted);font-size:.78rem}
.rail .num.ok{color:var(--pine)}
.rail button[aria-current="step"]{background:var(--navy);border-color:var(--navy);color:#fff}
.rail button[aria-current="step"] .num{color:#c9d8ea}
@media (prefers-color-scheme:dark){.rail button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#0f1a26}.rail button[aria-current="step"] .num{color:#21364d}}

/* Step head */
.step-head{margin-bottom:1rem}
.step-head .kicker{color:var(--pine);font-weight:600;font-size:.95rem}
.step-head h2{font-size:2rem;margin-top:.2rem}
.step-head h2:focus{outline:none}
.step-body{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Lists */
ol.do{margin:0;padding:0;list-style:none;counter-reset:d}
ol.do>li{counter-increment:d;position:relative;padding:.35rem 0 .35rem 2.6rem;max-width:42rem}
ol.do>li::before{content:counter(d);position:absolute;left:0;top:.35rem;width:1.8rem;height:1.8rem;border-radius:50%;border:2px solid var(--navy);display:grid;place-items:center;font-weight:600;font-size:.85rem;color:var(--accent)}
@media (prefers-color-scheme:dark){ol.do>li::before{border-color:var(--accent)}}

/* Iceberg */
.berg{margin-top:1.8rem;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.berg-top{background:var(--paper);padding:1.3rem 1.5rem 1.6rem}
.berg h3{font-size:1.05rem;margin-bottom:.8rem}
.tabs{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.5rem}
.tabs li{border:1.5px solid var(--navy);border-radius:10px;padding:.35rem .8rem;font-weight:600;font-size:.92rem;color:var(--accent)}
@media (prefers-color-scheme:dark){.tabs li{border-color:var(--accent)}}
.tabs b{margin-right:.4rem}
.water{height:22px;background:var(--navy-deep);-webkit-mask:radial-gradient(14px 12px at 14px 0,transparent 98%,#000) 0 0/28px 100%;mask:radial-gradient(14px 12px at 14px 0,transparent 98%,#000) 0 0/28px 100%;margin-top:-1px}
.berg-bottom{background:var(--navy-deep);color:#e8eef5;padding:.6rem 1.5rem 1.5rem}
.berg-bottom h3{color:#fff}
.berg-bottom ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:.35rem 1.6rem}
.berg-bottom li{position:relative;padding-left:1.1rem;font-size:.95rem;line-height:1.6}
.berg-bottom li::before{content:"";position:absolute;left:0;top:.6em;width:.45rem;height:.45rem;border-radius:50%;background:#7fc4a2}

/* Builder */
.builder{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;margin-top:1.6rem;align-items:start}
.field{display:block;margin-bottom:1rem}
.field>span{display:block;font-weight:600;margin-bottom:.35rem;font-size:.95rem}
.field textarea,.field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:.65rem .8rem;background:var(--paper);line-height:1.6;resize:vertical}
.field textarea:focus,.field input:focus{outline:3px solid var(--pine);outline-offset:1px;border-color:var(--pine)}
.outbox{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.3rem;position:sticky;top:6rem}
.outbox h3{font-size:1.05rem}
.hint{font-size:.88rem;color:var(--muted);margin:.3rem 0 .9rem}
.msgbox{white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:.95rem;line-height:1.7;margin:0 0 1rem;background:var(--bubble);border-radius:14px;padding:1rem 1.1rem}
.learned{margin-top:1.8rem;border-left:4px solid var(--pine);background:var(--pine-soft);padding:1.1rem 1.3rem;border-radius:0 14px 14px 0;max-width:46rem}
.learned h3{font-size:1rem;color:var(--pine);font-family:var(--sans);font-weight:600;margin-bottom:.3rem}

/* Chat */
.chat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.4rem;margin-top:1.6rem;max-width:46rem}
.chat>h3{font-size:1rem;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:1rem}
.msg{display:flex;flex-direction:column;margin-bottom:1.1rem}
.msg .who{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:.25rem}
.msg.me{align-items:flex-end}
.msg.me .bubble{background:var(--bubble);border-radius:18px 18px 4px 18px;max-width:88%}
.msg.ai .bubble{border:1px solid var(--line);border-radius:18px 18px 18px 4px;max-width:92%}
.bubble{padding:.85rem 1.1rem;font-size:.97rem;line-height:1.7}
.bubble p+p,.bubble p+div,.bubble div+p{margin-top:.6rem}
.msg .small-btn{margin-top:.4rem}
.codechip{display:inline-flex;align-items:center;gap:.6rem;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;font-size:.9rem;background:var(--bg)}
.codechip svg{width:22px;height:22px;flex:none}
.typing{display:inline-flex;gap:.3rem;padding:.9rem 1.1rem;border:1px solid var(--line);border-radius:18px 18px 18px 4px}
.typing i{width:.5rem;height:.5rem;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* Options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1rem;align-items:start}
.opt{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem}
.opt h4{font-family:var(--serif);font-size:1.05rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:.75rem;font-weight:600;background:var(--pine-soft);color:var(--pine);border-radius:999px;padding:.1rem .6rem}
.tag.opt-tag{background:var(--bubble);color:var(--muted)}
.opt p,.opt li{font-size:.94rem}
.opt ol.do>li{padding-left:2.3rem}
.opt ol.do>li::before{width:1.55rem;height:1.55rem;font-size:.75rem}
.sub-title{font-size:1.15rem;margin-top:2.2rem}

/* Mini editor + newsletter sheet */
.mini{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:start;margin-top:1rem}
.prev-label{font-weight:600;font-size:.9rem;color:var(--muted);margin-bottom:.5rem}
.sheet-wrap{container-type:inline-size;max-width:380px}
.sheet{background:#fff;color:#1d2530;aspect-ratio:1/1.414;box-shadow:0 1px 2px rgba(20,35,55,.12),0 8px 24px rgba(20,35,55,.10);border:1px solid #dfe4ea;overflow:hidden;display:flex;flex-direction:column;font-family:var(--sans)}
.sheet-band{display:none;background:#173b63;color:#fff;font-family:var(--serif);font-weight:700;font-size:4cqw;padding:3cqw 6cqw;letter-spacing:.02em}
.sheet.band .sheet-band{display:block}
.sheet-inner{padding:7cqw 7cqw 5cqw;flex:1;overflow:hidden}
.sheet-title{font-family:var(--serif);font-weight:700;font-size:6.2cqw;line-height:1.3;margin:0 0 4cqw;transition:font-size .3s,color .3s;word-break:break-word}
.sheet.big .sheet-title{font-size:9.5cqw;color:#173b63}
.sheet-main{display:block}
.sheet-photo{display:none;margin:0 0 4cqw}
.sheet-photo svg{display:block;width:100%;height:auto;border-radius:1cqw}
.sheet.photo .sheet-photo,.sheet.split .sheet-photo{display:block}
.sheet.split .sheet-main{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;align-items:start}
.sheet.split .sheet-photo{margin:0}
.sheet-body{font-size:3.7cqw;line-height:1.75;white-space:pre-wrap;word-break:break-word;color:#333d49}

/* Requests */
.edit-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:1.8rem;margin-top:1.6rem;align-items:start}
.edit-grid h3{font-size:1.05rem;margin-bottom:.8rem}
.reqs{display:grid;gap:.7rem}
.req{display:flex;gap:.9rem;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:.9rem 1rem;cursor:pointer;min-height:52px}
.req b{display:block;font-size:1rem}
.req-text{display:block;font-size:.88rem;color:var(--muted);line-height:1.6;margin-top:.15rem}
.req-check{flex:none;width:1.6rem;height:1.6rem;border-radius:7px;border:2px solid var(--line);margin-top:.1rem;display:grid;place-items:center}
.req[aria-pressed="true"]{border-color:var(--pine);background:var(--pine-soft)}
.req[aria-pressed="true"] .req-check{background:var(--pine);border-color:var(--pine)}
.req[aria-pressed="true"] .req-check::after{content:"";width:.45rem;height:.8rem;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
@media (prefers-color-scheme:dark){.req[aria-pressed="true"] .req-check::after{border-color:#0f1a26}}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;margin-top:1rem}
.cmp{border-radius:14px;padding:1.1rem 1.2rem;border-left:5px solid}
.cmp.bad{background:var(--warn-soft);border-color:var(--warn)}
.cmp.good{background:var(--pine-soft);border-color:var(--pine)}
.cmp .lbl{font-weight:600;font-size:.88rem}
.cmp.bad .lbl{color:var(--warn)}.cmp.good .lbl{color:var(--pine)}
.cmp q{display:block;font-family:var(--serif);font-size:1.08rem;margin:.35rem 0 .5rem;quotes:none}
.cmp p{font-size:.9rem;color:var(--muted)}
.tailbox{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem;margin-top:.5rem;background:var(--bubble);border-radius:12px;padding:.7rem 1rem}
.tailbox span{flex:1 1 16rem;font-weight:600}

/* Cases */
.cases{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
.case{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
.case b{display:block;font-family:var(--serif);margin-bottom:.25rem}
.case p{font-size:.93rem;color:var(--muted)}
.notice{margin-top:1.6rem;border:2px solid #d9b13b;border-radius:14px;padding:1rem 1.2rem;max-width:46rem}
.notice h3{font-size:1rem;margin-bottom:.25rem}

details{margin-top:1rem;border:1px solid var(--line);border-radius:12px;padding:.2rem 1.1rem;background:var(--paper)}
summary{cursor:pointer;font-weight:600;padding:.7rem 0;min-height:44px}
details ol{margin:.3rem 0 .6rem}
.note-small{font-size:.85rem;color:var(--muted);margin-bottom:.8rem}

.summary-list{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.summary-list li{counter-increment:s;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;font-size:.95rem}
.summary-list li::before{content:counter(s);display:block;font-family:var(--serif);font-weight:700;font-size:1.4rem;color:var(--pine)}

/* Tools */
.cycle-note{margin-top:1.1rem;text-align:center;font-size:.88rem;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.2rem;align-items:start}
.tool{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem}
.tool.used{border:2px solid var(--pine)}
.tool h4{font-family:var(--serif);font-size:1.1rem;margin:0 0 .7rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.tool dl{margin:0}
.tool dt{font-size:.8rem;font-weight:600;color:var(--muted)}
.tool dd{margin:0 0 .7rem;font-size:.93rem;line-height:1.65}
.tool-link{font-size:.88rem;font-weight:600}

/* Bottom nav */
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.pager .btn[disabled]{visibility:hidden}

footer{max-width:1080px;margin:0 auto;padding:1.5rem 1.25rem 2.5rem;font-size:.82rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;padding-bottom:calc(2.5rem + env(safe-area-inset-bottom,0px))}

.toast{position:fixed;left:50%;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,1rem);background:var(--navy);color:#fff;padding:.7rem 1.3rem;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .hero,.builder,.mini,.edit-grid{grid-template-columns:1fr}
  .rail{grid-template-columns:repeat(3,1fr)}
  .outbox{position:static}
  .summary-list{grid-template-columns:1fr 1fr}
  .tools{grid-template-columns:1fr}
}
@media (max-width:620px){
  html{font-size:calc(18px * var(--fs))}
  .hero h1{font-size:1.9rem}
  .step-head h2{font-size:1.6rem}
  .rail{grid-template-columns:1fr 1fr}
  .opts,.compare,.cases,.berg-bottom ul{grid-template-columns:1fr}
  .cycle{gap:2rem}
  .controls{margin-left:0}
  .topbar{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Light frosted-glass theme ===== */
:root{
  --bg:#eef3f8;--blue:#3f6ea5;--accent:#2f5b8f;--blue-soft:rgba(63,110,165,.12);--blue-line:rgba(63,110,165,.32);
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.76);--glass-border:rgba(255,255,255,.85);
  --glass-shadow:0 10px 30px rgba(48,80,120,.10),0 1px 2px rgba(48,80,120,.06),inset 0 1px 0 rgba(255,255,255,.7);
  --bubble:rgba(63,110,165,.09);--line:rgba(63,90,130,.16);--blur:blur(18px) saturate(150%);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a24;--blue:#6f9fd6;--accent:#a9c8ee;--blue-soft:rgba(111,159,214,.16);--blue-line:rgba(111,159,214,.4);
  --glass:rgba(32,44,60,.55);--glass-strong:rgba(36,50,68,.72);--glass-border:rgba(255,255,255,.09);
  --glass-shadow:0 10px 30px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.05);
  --bubble:rgba(111,159,214,.13);--line:rgba(255,255,255,.10);
}}
body{background:var(--bg)}

    toolsKey:'중요한 것은 도구가 아니라 방법입니다.',
    toolsNote:'설치가 어렵다면 ChatGPT 대화창에서 코드를 받아 메모장에 저장하는 방법으로도 시작할 수 있습니다. 각 도구의 요금과 설치 방법은 공식 사이트에서 확인하세요.',
    summaryTitle:'어떤 도구를 써도 바뀌지 않는 것',
    summary:['만들고 싶은 것을 메모로 정리합니다.','가장 작은 버전부터 만들어 달라고 합니다.','직접 열어서 써 보고, 바꿀 점을 하나씩 말합니다.','잘 되는 버전은 번호를 붙여 보관합니다.'],

      {n:'Claude Code',url:'https://docs.claude.com/en/docs/claude-code/overview',how:'Anthropic 推出的程式開發工具。AI 會在你電腦上的專案資料夾裡直接讀取和修改檔案，不需要複製貼上。可在命令列（終端機）或桌面應用程式中使用。',fit:'檔案變多、修改頻繁的人'},

/* ===== State ===== */
const store={get(k,d){try{const v=localStorage.getItem('nx_guide_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('nx_guide_'+k,JSON.stringify(v))}catch(e){}}};
const detectLang=()=>{const q=new URLSearchParams(location.search).get('lang');if(['ko','zh','en'].includes(q))return q;const s=store.get('lang',null);if(['ko','zh','en'].includes(s))return s;const n=(navigator.languages&&navigator.languages[0]||navigator.language||'ko').toLowerCase();return n.startsWith('zh')?'zh':n.startsWith('en')?'en':'ko'};
const S={lang:detectLang(),view:-1,fs:store.get('fs',1),visited:new Set(store.get('visited',[])),builder:null,revealed:false,

const T=()=>L[S.lang];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const miniTitle=()=>S.mini.title??T().s3.miniTitle;
const miniBody=()=>S.mini.body??T().s3.miniBody;
const builder=()=>S.builder||T().s2.def;
const reduced=()=>window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function railHTML(){
  return `<h2 class="rail-title">${esc(T().railTitle)}</h2><ol class="rail">${T().titles.map((t,i)=>{

}

function aiHTML(){const s=T().s3;return `<div class="msg ai"><div class="who">Codex</div><div class="bubble"><p>${esc(s.aiMsg)}</p><div class="codechip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 2.5h8l4.5 4.5v14.5H6z"/><path d="M14 2.5V7h4.5M9.5 15l2 2 3.5-4"/></svg><span>${esc(s.fileChip)}</span></div><p>${esc(s.aiMsg2)}</p></div></div>`}
function afterRevealHTML(){const s=T().s3;return `
  <div class="panel"><h3>${esc(s.viewTitle)}</h3>${doList(s.view)}</div>

/* ===== Render ===== */
function renderChrome(){
  const t=T();
  document.documentElement.lang=S.lang==='zh'?'zh-Hant':S.lang;
  document.title=t.docTitle;
  $('brand').textContent=t.brand;
  $('fsLabel').textContent=t.fontSize;
  $('fsMinus').setAttribute('aria-label',t.smaller);$('fsPlus').setAttribute('aria-label',t.larger);
  $('footNote').textContent=t.footer;
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===S.lang)));
  document.documentElement.style.setProperty('--fs',S.fs);
}
function render(){
  renderChrome();
  const t=T();
  if(S.view<0){$('main').innerHTML=homeHTML();return}
  const i=S.view;
  $('main').innerHTML=`${railHTML()}<section class="step-body" aria-labelledby="stepTitle">
    <div class="step-head"><div class="kicker">${esc(t.stepN.replace('{n}',i+1))}</div><h2 id="stepTitle" tabindex="-1">${esc(t.titles[i])}</h2></div>
    ${steps[i]()}
    <nav class="pager"><button type="button" class="btn" data-go="${i-1}" ${i===0?'disabled':''}>${esc(t.prev)}</button>
    ${i<5?`<button type="button" class="btn primary" data-go="${i+1}">${esc(t.next)}</button>`:`<button type="button" class="btn primary" data-go="-1">${esc(t.backTop)}</button>`}</nav>
  </section>`;
}
function go(i){
  S.view=Math.max(-1,Math.min(5,i));
  if(S.view>=0){S.visited.add(S.view);store.set('visited',[...S.visited])}
  render();
  window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});
  if(S.view>=0)setTimeout(()=>$('stepTitle')?.focus({preventScroll:true}),0);
}

/* ===== Copy ===== */
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const copySources={builder:()=>T().s2.prompt(builder()),s3user:()=>T().s3.userMsg,tail:()=>T().s4.tail,tpl:()=>T().s5.tpl,gh:()=>T().s6.bPrompt};
async function copyText(txt){
  try{await navigator.clipboard.writeText(txt);return true}catch(e){
    try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}
}

/* ===== Events ===== */
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g&&!g.disabled){go(Number(g.dataset.go));return}
  const l=e.target.closest('[data-lang]');if(l){S.lang=l.dataset.lang;store.set('lang',S.lang);S.builder=null;S.mini.title=null;S.mini.body=null;render();return}
  const c=e.target.closest('[data-copy]');if(c){const ok=await copyText(copySources[c.dataset.copy]());toast(ok?T().copied:T().copyFail);return}
  const r=e.target.closest('[data-req]');if(r){const k=r.dataset.req;S.mini[k]=!S.mini[k];r.setAttribute('aria-pressed',String(S.mini[k]));const sh=$('sheet');if(sh)sh.className=sheetClasses();return}
  if(e.target.closest('[data-act="reveal"]')){
    const slot=$('aiSlot');
    slot.innerHTML=`<div class="msg ai"><div class="who">Codex</div><div class="typing" role="status" aria-label="${esc(T().typing)}"><i></i><i></i><i></i></div></div>`;
    setTimeout(()=>{S.revealed=true;render();const ai=document.querySelector('.msg.ai');if(ai)ai.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'})},reduced()?0:1000);
  }
});
document.addEventListener('input',e=>{
  const b=e.target.dataset.b;
  if(b){S.builder={...builder(),[b]:e.target.value};$('bOut').textContent=T().s2.prompt(S.builder);return}
  const m=e.target.dataset.m;
  if(m){S.mini[m]=e.target.value;if(m==='title')$('sheetTitle').textContent=e.target.value;else $('sheetBody').textContent=e.target.value}
});
$('brand').onclick=()=>go(-1);
$('fsMinus').onclick=()=>{S.fs=Math.max(.9,Math.round((S.fs-.1)*10)/10);store.set('fs',S.fs);renderChrome()};
$('fsPlus').onclick=()=>{S.fs=Math.min(1.5,Math.round((S.fs+.1)*10)/10);store.set('fs',S.fs);renderChrome()};


/* Liquid glass: refraction where supported, light that follows the pointer */
(function(){
  const ua=navigator.userAgent;
  if(window.chrome&&/Chrome|Edg\//.test(ua)&&!/Firefox/.test(ua))document.documentElement.classList.add('lg-refract');
  if(reduced())return;
  const SEL='.panel,.outbox,.chat,.opt,.case,.tool,.cycle li,.rail button,.req,.summary-list li,details,.notice,.learned,.btn,.small-btn,.fontctl button,.cmp';
  let raf=0,last=null;
  document.addEventListener('pointermove',e=>{
    if(raf)return;raf=requestAnimationFrame(()=>{raf=0;
      const el=e.target.closest&&e.target.closest(SEL);
      if(last&&last!==el){last.style.removeProperty('--mx');last.style.removeProperty('--my')}
      if(el){const r=el.getBoundingClientRect();el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}
      last=el;});
  },{passive:true});
})();
render();
</script>
